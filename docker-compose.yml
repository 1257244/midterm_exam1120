# =====================================================================
# 開心飲品 連鎖店分散式系統 —— 閘道（總部機、分店機都需要）
#
#   gateway : Traefik 反向代理閘道（這台機器唯一的對外入口 :80）
#             自動偵測容器上的 labels，新服務啟動後「自動」加入路由，不用改設定
#
# 這台機器要跑什麼，由 .env 裡的 COMPOSE_FILE 決定：
#   總部機：docker-compose.yml + docker-compose.hq.yml      （範本 .env.hq.example）
#   分店機：docker-compose.yml + docker-compose.stores.yml  （範本 .env.store.example）
# =====================================================================
name: drinkshop

services:
  gateway:
    image: traefik:v3.6
    container_name: drink-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=drinknet
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true          # :8080 閘道監控面板（教學展示用）
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - drinknet

networks:
  drinknet:
    name: drinknet
