# ⚠️ 此檔由 scripts/gen-stores.sh 依 stores.csv 自動產生，請勿手動修改
# 所有分店都使用同一個 drink-store 映像檔，只有環境變數不同
services:

  store-taoyuan1:
    image: ${DOCKERHUB_USER:?請在 .env 設定 DOCKERHUB_USER}/drink-store:${TAG:-latest}
    container_name: drink-store-taoyuan1
    restart: unless-stopped
    depends_on:
      - hq
    environment:
      STORE_ID: "taoyuan1"
      STORE_NAME: "桃園中正店"
      STORE_CITY: "桃園市"
      MANAGER_USER: manager
      MANAGER_PASSWORD: "${STORE_PASSWORD_TAOYUAN1:-ty1pass}"
      HQ_URL: http://hq:5000
      HQ_API_KEY: ${HQ_API_KEY:-change-me-api-key}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      BRAND_NAME: ${BRAND_NAME:-開心飲品}
      SYNC_INTERVAL: "30"
      TZ: Asia/Taipei
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.store-taoyuan1.rule=Path(`/store/taoyuan1`) || PathPrefix(`/store/taoyuan1/`)"
      - "traefik.http.routers.store-taoyuan1.entrypoints=web"
      - "traefik.http.routers.store-taoyuan1.middlewares=store-taoyuan1-strip"
      - "traefik.http.middlewares.store-taoyuan1-strip.stripprefix.prefixes=/store/taoyuan1"
      - "traefik.http.services.store-taoyuan1.loadbalancer.server.port=5000"
    volumes:
      - store-taoyuan1-data:/data
    networks:
      - drinknet

